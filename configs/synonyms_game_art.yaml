# ArtGate v2 手写中文游戏美术同义 / 译名词表
#
# 性质：人工编写的领域词表，不是从金标自动挖掘的，也不是根据某一轮检索结果生成的。
# 覆盖常见游戏美术资产类别（武器与防具、角色、场景与建筑、道具、载具、UI、形状与材质）。
# 「剑」扩展为 sword / blade，不扩展为 knife：「剑」和「刀」在美术资产里通常是两类模型。
#
# 已知泄漏风险（必须和数字一起讲）：
# - 本词表写于 v1 评测发布之后，作者已经见过全量金标与坏例（含「一把剑」「圆形盾牌」等）。
# - 因此即使用意是「领域词表」，选词不可能宣称完全看不见金标。
# - 缓解：用固定种子、按语言分层把文本金标切成 dev / test；若要增补词条或改超参，
#   只允许看 dev。test 在词表与超参冻结之后只评一次。全量数字用于和 v1 对比。
#
# 用法：只用于 BM25 / 词法一路的查询扩展；默认不改 OpenCLIP 的原查询，以免稀释多语言语义。
# 匹配：在查询字符串上按词条长度从长到短做子串匹配（中文）或整词匹配（英文）。

